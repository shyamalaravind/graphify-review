<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Review</title>
<script>/*MARKED*/</script>
<style>
:root {
  --bg: #fbfaf8; --fg: #1f1e1c; --muted: #6b6862; --line: #e4e1db;
  --panel: #ffffff; --accent: #c2410c; --mark: #fde68a; --code: #f1efea;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a1918; --fg: #ebe9e4; --muted: #9c988f; --line: #33312e;
    --panel: #222120; --accent: #fb923c; --mark: #715c1c; --code: #2a2927; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px;
  max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; max-height: none; }
}
header { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
#plan { max-width: 760px; overflow-wrap: anywhere; }
#plan a { color: var(--accent); }
#plan pre, #plan code { background: var(--code); border-radius: 4px; font-size: 14px; }
#plan pre { padding: 12px; overflow-x: auto; }
#plan code { padding: 1px 4px; }
#plan pre code { padding: 0; }
#plan table { border-collapse: collapse; }
#plan th, #plan td { border: 1px solid var(--line); padding: 4px 8px; }
::highlight(review) { background: var(--mark); }
aside { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px);
  display: flex; flex-direction: column; gap: 12px; }
#list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
#empty { color: var(--muted); font-size: 14px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; }
.card blockquote { margin: 0 20px 6px 0; padding-left: 8px; border-left: 3px solid var(--mark);
  color: var(--muted); font-size: 13px; cursor: pointer;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.x { position: absolute; top: 4px; right: 6px; border: 0; background: none;
  color: var(--muted); font-size: 18px; cursor: pointer; }
textarea { width: 100%; resize: vertical; font: inherit; font-size: 14px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.row { display: flex; gap: 8px; }
button.btn { flex: 1; padding: 8px; border-radius: 6px; font: inherit; font-size: 14px;
  cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#add { position: absolute; padding: 4px 10px; border-radius: 6px; border: 0;
  background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
  box-shadow: 0 2px 8px rgb(0 0 0 / .2); }
button.quiet { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px;
  padding: 2px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
button.quiet:hover { color: var(--fg); }
.done { text-align: center; margin-top: 30vh; color: var(--muted); }
</style>
</head>
<body>
<main>
  <section>
    <header id="name"></header>
    <article id="plan"></article>
  </section>
  <aside>
    <div id="empty">Select text in the plan to comment on it.</div>
    <div id="list"></div>
    <textarea id="general" rows="3" placeholder="General comment (optional)"></textarea>
    <div class="row">
      <button class="btn" id="approve">Approve</button>
      <button class="btn primary" id="send">Request changes</button>
    </div>
    <button class="quiet" id="end">End review without feedback</button>
  </aside>
</main>
<button id="add" hidden>Comment</button>
<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const comments = [];
const hl = window.Highlight ? new Highlight() : null;
if (hl) CSS.highlights.set('review', hl);
let pending = null, sent = false;

const { name, title, text } = /*PLAN*/;
document.title = title || 'Review · ' + name;
$('#name').textContent = title || name;
marked.use({ renderer: { html: esc } });
$('#plan').innerHTML = marked.parse(text);

document.addEventListener('mouseup', e => {
  if (e.target.closest?.('#add')) return;
  setTimeout(() => {
    const sel = getSelection(), add = $('#add');
    if (!sel.rangeCount || sel.isCollapsed || !$('#plan').contains(sel.anchorNode)
        || !sel.toString().trim()) { add.hidden = true; return; }
    pending = sel.getRangeAt(0).cloneRange();
    const r = pending.getBoundingClientRect();
    add.style.top = r.bottom + scrollY + 6 + 'px';
    add.style.left = r.left + scrollX + 'px';
    add.hidden = false;
  });
});
$('#add').onmousedown = e => e.preventDefault();
$('#add').onclick = () => {
  $('#add').hidden = true;
  getSelection().removeAllRanges();
  addComment(pending);
};

function addComment(range) {
  const c = { quote: range.toString().trim(), range };
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<button class="x" title="Delete">×</button><blockquote></blockquote>'
    + '<textarea rows="3" placeholder="Comment…"></textarea>';
  const quote = card.querySelector('blockquote');
  quote.textContent = c.quote;
  quote.onclick = () => range.startContainer.parentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.querySelector('.x').onclick = () => {
    comments.splice(comments.indexOf(c), 1);
    hl?.delete(range);
    card.remove();
    $('#empty').hidden = comments.length > 0;
  };
  c.note = card.querySelector('textarea');
  comments.push(c);
  comments.sort((a, b) => a.range.compareBoundaryPoints(Range.START_TO_START, b.range));
  $('#list').insertBefore(card, $('#list').children[comments.indexOf(c)] || null);
  hl?.add(range);
  $('#empty').hidden = true;
  c.note.focus();
}

const collect = approved => ({
  approved,
  general: $('#general').value.trim(),
  comments: comments.map(c => ({ quote: c.quote, note: c.note.value.trim() })).filter(c => c.note),
});
const drafted = () => { const d = collect(false); return d.comments.length > 0 || d.general !== ''; };
const done = msg => { sent = true; document.body.innerHTML = '<p class="done">' + msg + '</p>'; };
const beacon = body =>
  navigator.sendBeacon('submit', new Blob([JSON.stringify(body)], { type: 'application/json' }));

async function submit(approved) {
  const body = collect(approved);
  if (!approved && !body.comments.length && !body.general) {
    alert('Add a comment first, or approve.');
    return;
  }
  try {
    await fetch('submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {
    alert('Could not reach Claude — the review process has stopped.');
    return;
  }
  done('Sent to Claude. You can close this tab.');
}

// Ending sends no feedback: the agent is told the review stopped, with no instructions.
function end() {
  if (drafted() && !confirm('End the review? Your comments are discarded and nothing is sent back.')) return;
  sent = true;
  beacon({ ended: true, immediate: true });
  done('Review ended — no feedback sent. You can close this tab.');
}

$('#approve').onclick = () => submit(true);
$('#send').onclick = () => submit(false);
$('#end').onclick = end;
// Closing the tab ends the review too, rather than leaving the agent waiting forever.
// Without `immediate` the server holds the end briefly, so a reload can reclaim the review.
addEventListener('pagehide', () => { if (!sent) beacon({ ended: true }); });
addEventListener('beforeunload', e => { if (!sent && drafted()) e.preventDefault(); });
</script>
</body>
</html>
